name: Capture Real Emulator Screenshots (v2.6.1)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/capture-screenshots.yml"
      - ".github/scripts/capture_screens.py"
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Build Fixed Debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          ls -lh app-debug.apk

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Run Headless Pixel 6 Emulator & Capture All Screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            mkdir -p screenshots
            python3 .github/scripts/capture_screens.py --apk app-debug.apk --out screenshots 2>&1 | tee screenshots/capture.log

      - name: Package Screenshots & Diagnostics Archive
        run: |
          ls -lh screenshots/
          grep -E "FixtureRepository|AndroidRuntime" screenshots/logcat.txt || true
          zip -j v2.6.1-screenshots.zip screenshots/*.png screenshots/logcat.txt screenshots/capture.log

      - name: Upload Screenshots Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2.6.1-screenshots
          path: screenshots/

      - name: Publish Screenshots Asset for Verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots-v2.6.1 --yes || true
          git push origin :refs/tags/screenshots-v2.6.1 || true
          gh release create screenshots-v2.6.1 v2.6.1-screenshots.zip \
            --prerelease \
            --title "Football Calendar v2.6.1 Screenshots" \
            --notes "Automated real Android 14 Pixel 6 emulator screenshots of v2.6.1."
